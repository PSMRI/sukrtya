apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  labels:
    app: springboot-app
  name: springboot-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
      - name: my-springboot-app
        image: t050752608385.dkr.ecr.ap-south-1.amazonaws.com/piramal/tech4gov:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8085
          name: http
          protocol: TCP
# service type nodeport       
---
apiVersion: v1
kind: Service
metadata:
  namespace: default
  labels:
    app: springboot-app
    k8s-app: springboot-app
  name: springboot-service
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8085
    nodePort: 32055
  type: NodePort
  selector:
    app: springboot-app