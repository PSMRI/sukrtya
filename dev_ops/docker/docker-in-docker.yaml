apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-in-docker
  labels:
    app: docker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker
  template:
    metadata:
      labels:
        app: docker
    spec:
      containers:
      - name: docker
        image: docker:latest  # This is the official Docker-in-Docker image
        securityContext:
          privileged: true  # This grants Docker container access to the host Docker daemon (important for DinD)
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock  # Mount the host Docker socket
