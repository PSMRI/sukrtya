pipeline {
    agent {
        kubernetes {
            label 'eks-agent'  // Label for the pod
            defaultContainer 'kubectl'  // Default container where kubectl and AWS CLI are installed
            yaml """
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: eks-deployment
spec:
  containers:
  - name: kubectl
    image: 'amazon/aws-cli:2.11.0'  // AWS CLI image that can also run kubectl
    command:
      - sleep
      - "infinity"  // Keeps the pod running for as long as needed
    volumeMounts:
      - name: kubeconfig
        mountPath: /root/.kube  // Mount the kubeconfig for kubectl
  volumes:
    - name: kubeconfig
      secret:
        secretName: your-kubeconfig-secret  // Secret containing your kubeconfig (make sure this exists in the same namespace)
"""
        }
    }

    environment {
        DOCKER_IMAGE = "050752608385.dkr.ecr.ap-south-1.amazonaws.com/piramal/tech4gov"  // Docker image URL
        DEPLOYMENT_NAME = 'test_app_1'   // Kubernetes deployment name
        NAMESPACE = 'default'  // Kubernetes namespace
    }

    stages {
        stage('Set up Kubernetes Context') {
            steps {
                script {
                    // Use AWS CLI to update kubeconfig to point to your EKS cluster
                    sh """
                    aws eks --region ap-south-1 update-kubeconfig --name your-cluster-name
                    """
                }
            }
        }

        stage('Deploy to Kubernetes') {
            steps {
                script {
                    // Deploy the Docker image to Kubernetes
                    sh """
                    kubectl set image deployment/${DEPLOYMENT_NAME} ${DEPLOYMENT_NAME}=${DOCKER_IMAGE} -n ${NAMESPACE}
                    kubectl rollout status deployment/${DEPLOYMENT_NAME} -n ${NAMESPACE}
                    """
                }
            }
        }
    }

    post {
        always {
            echo "Deployment complete."
        }
    }
}
