apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default
data:
  nginx.conf: |
    events {}

    http {
        upstream service1 {
            server service1:8080;
        }

        upstream service2 {
            server service2:5000;
        }

        server {
            listen 80;

            location / {
                proxy_pass http://service1;
            }

            location /api/ {
                proxy_pass http://service2;
            }
        }
    }
