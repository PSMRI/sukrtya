services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4318:4318"
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  app:
    image: sukrtya-api:latest
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://192.168.20.18:5432/SUkrtya
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Psmri@2024
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=sukrtya-104
    volumes:
      - ./logs:/app/logs
