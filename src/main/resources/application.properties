spring.application.name=sukrtya-siwan

# Default 8080. If "Port already in use", stop the other JVM or set SERVER_PORT (e.g. 8081).
server.port=${SERVER_PORT:8080}

# spring.datasource.url=jdbc:postgresql://localhost:5432/sukrtya_siwan
# spring.datasource.username=postgres
# spring.datasource.password=postgres

spring.datasource.url=jdbc:postgresql://${DB_IP:13.127.161.206}:${DB_PORT:5432}/${DB_NAME:suksukrtya_siwan}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Psmri@2024}

spring.flyway.enabled=true
# If the DB was created manually or restored without flyway_schema_history, accept existing objects.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health,info

# First-time admin portal user (created on startup if username does not exist).
app.seed.default-admin-username=admin
app.seed.default-admin-password=Admin@123

# CHO mobile data collectors created from Excel import: login id = 10-digit mobile; first-time password.
app.seed.cho-collector-default-password=User@123

# JWT access tokens (HS256). Use a long random secret in production.
app.jwt.secret=dev-change-me-please-use-at-least-32-chars-long-for-hs256-key
app.jwt.access-token-validity-seconds=28800