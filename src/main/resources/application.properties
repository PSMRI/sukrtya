spring.application.name=sukrtya-siwan

# Default 8080. If "Port already in use", stop the other JVM or set SERVER_PORT (e.g. 8081).
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://localhost:5432/sukrtya_siwan
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.enabled=true
# If the DB was created manually or restored without flyway_schema_history, accept existing objects.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB