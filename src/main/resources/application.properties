# PostgreSQL configuration

#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.sukrtya.in:5432/SUkrtya}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Zltj6ghj6J}
spring.datasource.url=jdbc:postgresql://${DB_IP:192.168.20.18}:${DB_PORT:5432}/SUkrtya
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Psmri@2024}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
## Optional: JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always

# Logging configuration
logging.config=classpath:logback-spring.xml
logging.file.path=./logs
logging.file.name=./logs/sukrtya.log
logging.level.root=info
logging.level.com.piramal.sukrtya=DEBUG
logging.level.org.springframework=info

management.endpoints.web.exposure.include=health


#OpenTelemetry Jaeger Tracing Configuration
tracing.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318/v1/traces}
management.tracing.sampling.probability=1.0

# Additional OpenTelemetry Configuration
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${tracing.url}
otel.exporter.otlp.protocol=http/protobuf
otel.sdk.disabled=false
otel.traces.sampler=parentbased_always_on

#Logging Format (Jaeger traceId & spanId included)
logging.pattern.level='%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'

