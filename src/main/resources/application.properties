spring.datasource.url=jdbc:postgresql://${DB_IP:database-1.chm64akk2jtu.ap-south-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:sukrtya_siwan}?sslmode=require
spring.datasource.username=${DB_USERNAME:app_sukritiya_user}
spring.datasource.password=${DB_PASSWORD:Sukr!tiya_RDS_2026#Pg9}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
# If the DB was created manually or restored without flyway_schema_history, accept existing objects.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=none

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Surface ResponseStatusException reason text in the JSON error body so 4xx responses include
# a "message" field explaining the failure (e.g. "You do not have access to this facility.").
# Stacktraces are NEVER returned to clients.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info

# First-time admin portal user (created on startup if username does not exist).
app.seed.default-admin-username=admin
app.seed.default-admin-password=Admin@123

# CHO mobile data collectors created from Excel import: login id = 10-digit mobile; first-time password.
app.seed.cho-collector-default-password=User@123

# JWT access tokens (HS256). Use a long random secret in production.
app.jwt.secret=dev-change-me-please-use-at-least-32-chars-long-for-hs256-key
app.jwt.access-token-validity-seconds=28800


